plugins {
	id 'com.gradleup.shadow'
}

base {
	archivesName = "${archives_base_name}-${minecraft_version}"
}

repositories {
	maven {
		name = 'johnymuffin-nexus'
		url = uri('https://repository.johnymuffin.com/repository/maven-public/')
	}
	maven {
		name = 'johnymuffin-nexus-snapshots'
		url = uri('https://repository.johnymuffin.com/repository/maven-snapshots/')
	}
}

configurations {
	bundled
	implementation.extendsFrom bundled
}

dependencies {
	compileOnly "com.legacyminecraft.poseidon:poseidon-craftbukkit:${poseidon_version}"

	bundled(project(':common'))
	bundled(project(':server-common'))
}

processResources {
	inputs.property 'version', project.version
	filesMatching('plugin.yml') {
		expand version: project.version
	}
}

shadowJar {
	configurations = [project.configurations.bundled]
	archiveClassifier.set('Poseidon')
	// Poseidon ships its own (older) Gson; ours is relocated so neither sees the other.
	relocate 'com.google.gson', 'com.moyettes.legacyvoicechat.shadow.gson'
	// Nothing log4j: server code logs through log.VoiceLog (java.util.logging here).
	dependencies {
		exclude(dependency('org.apache.logging.log4j:.*'))
		exclude(dependency('com.google.errorprone:.*'))
	}
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${base.archivesName.get()}" }
	}
	from(rootProject.file('licenses/gson-NOTICE.txt')) {
		into 'META-INF/licenses/legacyvoicechat'
	}
}

tasks.named('build') {
	dependsOn tasks.named('shadowJar')
}

tasks.named('jar') {
	enabled = false
}
