pluginManagement {
	repositories {
		exclusiveContent {
			forRepository {
				maven {
					name = 'Fabric'
					url = uri('https://maven.fabricmc.net')
				}
			}
			filter {
				includeGroupAndSubgroups('net.fabricmc')
				includeGroup('fabric-loom')
			}
		}
		exclusiveContent {
			forRepository {
				maven {
					name = 'Ornithe Releases'
					url = uri('https://maven.ornithemc.net/releases')
				}
			}
			filter {
				includeGroupAndSubgroups('net.ornithemc')
				includeGroup('ploceus')
				// Ploceus' signature patcher
				includeGroup('io.github.gaming32')
			}
		}
		gradlePluginPortal()
		mavenCentral()
	}
	plugins {
		id 'net.fabricmc.fabric-loom-remap' version providers.gradleProperty('loom_version').get()
		id 'ploceus' version providers.gradleProperty('ploceus_version').get()
		id 'com.gradleup.shadow' version providers.gradleProperty('shadow_version').get()
	}
}

plugins {
	// Java 21 toolchain for javac (bytecode stays Java 8: options.release = 8).
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'legacyvoicechat'

include ':common'
include ':client-common'
include ':server-common'

// Beta/early versions ship split client and server jars; one module each.
include ':ornithe-b1.0:client'
include ':ornithe-b1.0:server'
include ':ornithe-b1.4:client'
include ':ornithe-b1.4:server'
include ':ornithe-b1.7.3:client'
include ':ornithe-b1.7.3:server'
include ':ornithe-b1.8:client'
include ':ornithe-b1.8:server'
include ':ornithe-1.0.0:client'
include ':ornithe-1.0.0:server'
include ':ornithe-1.1:client'
include ':ornithe-1.1:server'
include ':ornithe-1.2.5:client'
include ':ornithe-1.2.5:server'

// MC 1.3+ ships a merged client/server jar; one module per version.
include ':ornithe-1.3.1'
include ':ornithe-1.3.2'
include ':ornithe-1.4.7'
include ':ornithe-1.5.1'
include ':ornithe-1.5.2'
include ':ornithe-1.6.1'
include ':ornithe-1.6.4'
include ':ornithe-1.7.2'
include ':ornithe-1.7.4'
include ':ornithe-1.7.10'
include ':ornithe-1.8'
include ':ornithe-1.8.8'
include ':ornithe-1.8.9'
include ':ornithe-1.9.4'
include ':ornithe-1.10.2'
include ':ornithe-1.11.2'
