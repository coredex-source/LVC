plugins {
	id 'base'
	// Loaded once on the root classloader, shared by every Ornithe module (gradle/ornithe.gradle).
	id 'net.fabricmc.fabric-loom-remap' apply false
	id 'ploceus' apply false
	id 'com.gradleup.shadow' apply false
}

allprojects {
	group = project.maven_group
	version = project.version
}

subprojects {
	apply plugin: 'java'

	repositories {
		mavenCentral()
		maven {
			name = 'plasmoverse'
			url = uri('https://repo.plasmoverse.com/releases/')
		}
	}

	java {
		// javac from JDK 21; the mods and the plugin stay Java 8 bytecode (Beta-era servers and clients).
		toolchain.languageVersion = JavaLanguageVersion.of(21)
		withSourcesJar()
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 8
		// JDK 21 warns that release 8 is deprecated; keep the build log readable.
		options.compilerArgs << '-Xlint:-options'
	}
}

tasks.register('buildAllClients') {
	group = 'build'
	description = 'Builds every client-side module (split :client modules and the merged 1.3+ modules).'
	dependsOn subprojects.findAll { it.path.endsWith(':client') || it.findProperty('environment') == 'merged' }
		.collect { it.path + ':build' }
}

tasks.register('buildAllServers') {
	group = 'build'
	description = 'Builds every server-side module (split :server modules and the Poseidon plugin).'
	dependsOn subprojects.findAll { it.path.endsWith(':server') || it.path == ':poseidon-b1.7.3' }
		.collect { it.path + ':build' }
}

tasks.register('collectJars', Copy) {
	group = 'distribution'
	description = 'Copies every module\'s release jar into build/dist/.'
	// Lazy: with configure-on-demand the modules are configured after the root.
	from { subprojects.findAll { it.tasks.findByName('remapJar') != null }.collect { it.tasks.named('remapJar').get().archiveFile } }
	from { subprojects.findAll { it.path == ':poseidon-b1.7.3' }.collect { it.tasks.named('shadowJar').get().archiveFile } }
	dependsOn subprojects.findAll { it.path.startsWith(':ornithe-') && it.findProperty('environment') != null || it.path == ':poseidon-b1.7.3' }
		.collect { it.path + ':build' }
	into rootProject.layout.buildDirectory.dir('dist')
}

// `./gradlew build` refreshes build/dist/ with the current artifacts.
tasks.named('build').configure { dependsOn 'collectJars' }
