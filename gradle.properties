org.gradle.jvmargs = -Xmx4G
org.gradle.parallel = true
# Building one module configures only that module (each Loom project sets up its own game version).
org.gradle.configureondemand = true

version = 0.1.0
maven_group = com.moyettes.legacyvoicechat
archives_base_name = LegacyVoiceChat

# Ornithe gen2 toolchain (checked 2026-11-15 against meta.ornithemc.net and the Ornithe/Fabric mavens).
# Ploceus 1.19.x builds against Loom 1.19; Loom 1.19 needs Gradle 9.8 running on Java 21+ (25 recommended).
loom_version = 1.19.4
ploceus_version = 1.19.1
shadow_version = 9.6.1
intermediary_generation = 2
# https://meta.ornithemc.net/v3/versions/fabric-loader (latest stable)
loader_version = 0.20.1
# Ornithe Standard Libraries, gen2 (https://modrinth.com/mod/osl)
osl_version = 0.24.0
